html,body,#root{margin:0;min-height:100%}body{background:var(--ds-page)}.law-site{--law-green:#244b3c;--law-deep:#10291f;--law-gold:#bea77a;color:#263d32}.law-site article,.law-site section,.law-site footer,.law-site header{box-sizing:border-box}.law-site>div{padding:0;max-width:1040px;overflow:hidden}.law-site h1,.law-site h2,.law-site h3,.law-site p{margin:0}.law-site p{line-height:1.9}.law-top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 38px;background:var(--law-deep);color:white}.law-identity{display:flex;align-items:center;gap:12px}.law-crest{height:36px;width:auto;flex-shrink:0;display:block}.law-identity strong{display:block;font-size:23px;line-height:1.4}.law-identity span{display:block;font-size:11px;opacity:.75}.law-nav{display:flex;gap:22px;flex-wrap:wrap}.law-nav a{color:#fff;text-decoration:none;font-size:13px;min-height:44px;display:flex;align-items:center;border-bottom:2px solid transparent}.law-nav a[aria-current=page]{border-color:var(--law-gold)}.law-hero{position:relative;min-height:460px;display:flex;align-items:center;color:white;isolation:isolate;overflow:visible;margin-bottom:40px}.law-hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.law-hero:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(9,24,18,.05),rgba(9,24,18,.42))}.law-hero-content{padding:54px 7%;max-width:64%}.law-kicker{color:#d6c49e;letter-spacing:.03em;font-size:13px}.law-hero h1{font-size:30px;line-height:1.6;font-weight:400;margin:12px 0}.law-hero h1 strong{font-size:54px;font-weight:600}.law-hero p{font-size:17px;color:#e3e9e3;margin-bottom:24px}.law-button{display:inline-flex;gap:28px;align-items:center;justify-content:center;background:var(--law-green);padding:9px 23px;color:white;text-decoration:none;min-height:44px;box-sizing:border-box;font-size:14px;border-radius:3px}.law-light{background:#f5f4ed;color:var(--law-deep)}.law-button:hover{filter:brightness(.94)}.law-hero-seal{position:absolute;bottom:-31px;inset-inline-start:calc(50% - 37px);width:74px;height:74px;border-radius:50% 50% 0 0;background:var(--law-deep);display:flex;align-items:center;justify-content:center}.law-hero-seal .law-crest{height:32px;width:auto}.law-section{padding:38px 52px}.law-section-head{text-align:center;margin-bottom:32px}.law-section-head>span{font-size:12px;color:#6f7b73}.law-section-head h2{font-size:28px;line-height:1.6;font-weight:500;margin:4px 0 12px}.law-section-head i{display:block;background:var(--law-gold);height:2px;width:40px;margin:auto}.law-intro{text-align:center;max-width:780px;margin:auto}.law-intro p{margin-bottom:22px;color:#59635e}.law-services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:38px 35px}.law-service{text-align:center;min-width:0}.law-shield-top{width:106px;height:17px;margin:0 auto 10px;background:var(--law-green);clip-path:polygon(0 35%,25% 33%,50% 0,75% 33%,100% 35%,100% 78%,75% 76%,50% 45%,25% 76%,0 78%)}.law-shield{height:154px;width:158px;margin:auto;clip-path:polygon(0 0,50% 8%,100% 0,100% 72%,50% 100%,0 72%);background:var(--law-green)}.law-shield img{width:100%;height:100%;object-fit:cover}.law-index{display:block;margin:14px 0 3px;color:#9c845b;font-size:12px}.law-service h3{font-size:17px;font-weight:600;line-height:1.6}.law-service p{font-size:13px;color:#647167;margin:9px auto 12px;max-width:245px}.law-small-link{font-size:12px;color:var(--law-green);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid #d7ded7;border-radius:3px}.law-center{text-align:center;margin-top:32px}.law-principles{padding:44px 52px;background:#f2f5f1;margin:28px 0}.law-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;text-align:center}.law-steps b{font-size:28px;font-weight:400;color:var(--law-green)}.law-steps h3{font-size:17px;margin:10px 0}.law-steps p{font-size:13px;color:#647167}.law-article- -size:18px;font-weight:600;align-self:start;white-space:nowrap}.law-contact-card>small{font-size:12px;color:#647167}.law-office{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:28px 0}.law-office h3,.law-note h3{font-size:17px;margin-bottom:8px}.law-office p{font-size:14px;color:#647167}.law-note{padding:20px 24px;border-inline-start:3px solid var(--law-gold);background:#f2f5f1}.law-note p{font-size:14px;color:#647167}

@media(max-width:350px){.law-services{grid-template-columns:1fr;gap:32px}.law-shield{width:164px;height:150px}.law-shield-top{width:110px}.law-nav{gap:15px}.law-nav a{font-size:12px}.law-hero h1 strong{font-size:37px}.law-section-head h2{font-size:22px}.law-contact-card>bdi{font-size:14px}}
.law-site .file-card{padding:0;gap:0;max-width:1040px;overflow:hidden;display:block}.law-site .law-button{color:white}.law-site .law-light{color:var(--law-deep)}.law-site .law-nav a{color:white}.law-site .law-small-link,.law-site .law-contact-card,.law-site .law-footer-main a{color:var(--law-green)}

<body>
<div id="root"></div>
<script>/* Lawyer site - static port. Reads content.json, renders the exact original markup. */
(function(){
var C=null;var C=null;function img(s){return s;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function crest(){return '<img class="law-crest" src="'+esc(img(C.images.logo))+'" alt="شعار المحامي ممدوح حازم"/>';}
function action(to,label,light){return '<a class="law-button file-hover-underline'+(light?' law-light':'')+'" href="#'+to+'">'+esc(label)+'<span aria-hidden="true">←</span></a>';}
function sectionHead(small,title){return '<div class="law-section-head"><span>'+esc(small)+'</span><h2>'+esc(title)+'</h2><i></i></div>';}
function pad(n){n=String(n);return n.length<2?'0'+n:n;}
function areaCards(all){
  var list=all?C.areas:C.areas.slice(0,6);
  var h='<div class="law-services">';
  list.forEach(function(a,i){
    var photo=img((i%3===2)?C.images.hero:C.images.legal);
    var pos=(i%3===0)?'52% 60%':(i%3===1?'5% 50%':'25% 50%');
    h+='<article class="law-service"><div class="law-shield-top"></div><div class="law-shield"><img src="'+photo+'" style="object-position:'+pos+'" alt="صورة توضيحية للعدالة والعمل القانوني"/></div><span class="law-index">'+pad(a.number)+'</span><h3>'+esc(a.name)+'</h3><p>'+esc(a.detail)+'</p><a class="law-small-link file-hover-underline" href="#/contact">استفسر عن الخدمة ←</a></article>';
  });
  return h+'</div>';
}
function pageTitle(title,sub){return '<div class="law-page-title"><header class="file-header"><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></header></div>';}
function banner(){
  var b=C.banner;
  return '<section class="law-contact-banner" style="background-image:linear-gradient(90deg,rgba(14,38,29,.94),rgba(14,38,29,.86)),url('+esc(img(C.images.hero))+')"><span>'+esc(b.kicker)+'</span><h2>'+esc(b.line1)+'<br/>'+esc(b.line2)+'</h2>'+action('/contact',b.button,true)+'</section>';
}
function postCard(a){return '<article class="law-article"><span>'+esc(a.branch)+' · '+pad(a.number)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.body[0])+'</p><a class="law-small-link file-hover-underline" href="#/articles/'+a.number+'">اقرأ المقال ←</a></article>';}

function helpCards(i){return '<div class="law-help-grid">'+i.items.map(function(it){return '<article class="law-help-card"><h3>'+esc(it.title)+'</h3><p>'+esc(it.text)+'</p></article>';}).join('')+'</div>';}
function intakeForm(){var f=C.intake;return '<section class="law-section law-intake"><div class="law-intake-inner"><div class="law-section-head"><h2>'+esc(f.title)+'</h2><i></i></div><p class="law-intake-intro">'+esc(f.description)+'</p><form id="legal-intake-form"><label for="legal-problem">'+esc(f.label)+'</label><textarea id="legal-problem" maxlength="900" required placeholder="'+esc(f.placeholder)+'" aria-describedby="legal-intake-warning"></textarea><p class="law-intake-warning" id="legal-intake-warning">'+esc(f.warning)+'</p><button class="law-button" type="submit">'+esc(f.button)+'<span aria-hidden="true">←</span></button></form></div></section>';}
function home(){
  var h=C.hero,i=C.intro,s=C.steps,ah=C.articlesHead,sh=C.servicesHead;
  return '<section class="law-hero"><img class="law-hero-photo" src="'+esc(img(C.images.hero))+'" alt="أعمدة كلاسيكية، صورة توضيحية مولدة"/><div class="law-hero-content"><span class="law-kicker">'+esc(h.kicker)+'</span><h1>'+esc(h.titleBefore)+'<br/><strong>'+esc(C.name)+'</strong></h1><p>'+esc(h.subtitle1)+'<br/>'+esc(h.subtitle2)+'</p>'+action('/contact',h.button,true)+'</div><div class="law-hero-seal">'+crest()+'</div></section>'
  +'<section class="law-section law-help">'+sectionHead(i.small,i.title)+helpCards(i)+'<div class="law-center">'+action('/contact',i.button)+'</div></section>'+intakeForm()
  +'<section class="law-section">'+sectionHead(sh.small,sh.title)+areaCards(false)+'<div class="law-center">'+action('/services',sh.button)+'</div></section>'
  +'<section class="law-principles">'+sectionHead(s.small,s.title)+'<div class="law-steps">'+s.items.map(function(it,idx){return '<div><b>0'+(idx+1)+'</b><h3>'+esc(it.title)+'</h3><p>'+esc(it.text)+'</p></div>';}).join('')+'</div></section>'
  +'<section class="law-section">'+sectionHead(ah.small,ah.title)+'<div class="law-article-grid">'+C.posts.slice(0,3).map(postCard).join('')+'</div><div class="law-center">'+action('/articles',ah.button)+'</div></section>'
  +banner();
}
function about(){var i=C.intro;return pageTitle(i.title,'خدمات قانونية تُناقش حسب تفاصيل كل حالة.')+'<section class="law-section law-help">'+sectionHead(i.small,i.title)+helpCards(i)+'<div class="law-center">'+action('/contact',i.button,true)+'</div></section>'+intakeForm()+banner();}
function services(){return pageTitle(C.servicesPage.title,C.servicesPage.sub)+'<section class="law-section">'+areaCards(true)+'</section>'+banner();}
function articles(){return pageTitle(C.articlesPage.title,C.articlesPage.sub)+'<section class="law-section law-article-grid">'+C.posts.map(postCard).join('')+'</section>'+banner();}
function post(n){
  var a=C.posts.filter(function(p){return p.number===n;})[0];
  if(!a)return articles();
  var next=C.posts[(C.posts.indexOf(a)+1)%C.posts.length];
  var body=a.body.map(function(l){
    if(l.indexOf('- ')===0)return '<p class="law-bullet">• '+rich(l.slice(2))+'</p>';
    return '<p>'+rich(l)+'</p>';
  }).join('');
  return pageTitle(a.title,a.branch)
  +'<section class="law-section law-post">'+body+'<p class="law-muted">'+esc(C.articleNote)+'</p><div class="law-post-nav">'+action('/articles','كل المقالات')+action('/articles/'+next.number,'المقال التالي')+'</div></section>'+banner();
}
function contact(){
  var c=C.contactPage;
  return pageTitle(c.title,c.sub)
  +'<section class="law-section"><div class="law-contact-options">'
  +'<a class="law-contact-card file-hover-underline" href="tel:'+esc(C.phone)+'"><span>'+esc(c.callLabel)+'</span><bdi dir="ltr">'+esc(C.phone)+'</bdi><small>'+esc(c.callHint)+' ←</small></a>'
  +'<a class="law-contact-card file-hover-underline" href="mailto:'+esc(C.email)+'" target="_blank" rel="noopener noreferrer"><span>'+esc(c.emailLabel)+'</span><bdi dir="ltr">'+esc(C.email)+'</bdi><small>'+esc(c.emailHint)+' ←</small></a>'
  +'</div><div class="law-office"><div><h3>'+esc(c.officeTitle)+'</h3><p>'+esc(c.officeText)+'</p></div><div><h3>'+esc(c.hoursTitle)+'</h3><p>'+esc(c.hoursText)+'</p></div></div>'
  +'<div class="law-note"><h3>'+esc(c.noteTitle)+'</h3><p>'+esc(c.noteText)+'</p></div></section>'+intakeForm();
}
function navLink(to,label,current){return '<a href="#'+to+'"'+(current?' aria-current="page"':'')+'>'+esc(label)+'</a>';}
function whatsappNumber(){var p=String(C.phone||'').replace(/\D/g,'');if(p.indexOf('00')===0)p=p.slice(2);if(p.charAt(0)==='0')p='20'+p.slice(1);return p;}
function whatsappLink(message){return 'https://wa.me/'+whatsappNumber()+'?text='+encodeURIComponent(message);}
function shell(inner,route){
  var nav='<nav class="law-nav" aria-label="صفحات الموقع">'
    +navLink('/','الرئيسية',route==='/')
    +navLink('/about','إزاي أقدر أساعدك',route==='/about')
    +navLink('/services','الخدمات',route==='/services')
    +navLink('/articles','المقالات',route.indexOf('/articles')===0)
    +navLink('/contact','تواصل',route==='/contact')
    +'</nav>';
  return '<div class="law-site"><main dir="rtl" lang="ar" class="file-card" data-width="fluid">'
    +'<header class="law-top"><div class="law-identity">'+crest()+'<div><strong>'+esc(C.name)+'</strong><span>للمحاماة والاستشارات القانونية</span></div></div>'+nav+'</header>'
