<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>مكتبي</title>
<style>:root{--navy:#0f2a4a;--gold:#c9a24b;--bg:#f4f6fa;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dde3ec;--red:#b3261e;--grn:#1e7a46}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:16px;line-height:1.6}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header h1 span{color:var(--gold)}
header button{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{flex:1 1 140px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:#fff;font:inherit;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;border-inline-start:4px solid var(--gold)}
.tc b{display:block;color:var(--navy)}
.tc small{color:var(--mut)}
.tc.ai{opacity:.6;border-inline-start-color:#999}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 8px;color:var(--navy);font-size:17px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
textarea{min-height:90px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
button.b{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;margin:8px 4px 0 0}
button.b.g{background:var(--gold);color:#111}
button.b.r{background:var(--red)}
button.b.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.b.s{padding:4px 9px;font-size:13px;margin:0}
.res{background:#eef3fb;border-radius:10px;padding:10px;margin-top:10px}
.res .k{color:var(--mut);font-size:14px}
.res .v{font-weight:700;color:var(--navy);font-size:18px}
.warn{background:#fff6dd;border:1px solid #e8d08a;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.note{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--bd);padding:6px;text-align:start;vertical-align:top}
th{background:#f0f3f8}
.tw{overflow-x:auto}
td input,td select{padding:5px;min-width:80px}
.over{color:var(--red);font-weight:700}
.ok{color:var(--grn)}
.doc{background:#fff;border:1px solid var(--bd);padding:18px;border-radius:8px;margin-top:10px;line-height:1.9}
.doc h2{text-align:center;color:#000}
.back{margin-bottom:10px}
#lock{position:fixed;inset:0;background:var(--navy);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{max-width:340px;width:100%}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:0;font-size:14pt;color:#000;background:#fff}#printArea table{font-size:12pt}}
@media(min-width:760px){.pin{position:sticky;top:52px;z-index:4}}.pin{border-color:var(--gold)}
</style>
</head><body>
<header><h1>⚖️ مكتبي <span>| أدوات خاصة</span></h1><button id="bkp">نسخة احتياطية</button><button id="lk">قفل</button></header>
<main id="app"></main>
<div id="printArea"></div>
<div id="lock" style="display:none"></div>
<script>/* core helpers: storage, forms, export. No secrets. Data stays in this browser only. */
const $=(s,e)=>(e||document).querySelector(s);
const $$=(s,e)=>[...(e||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={};
try{D=JSON.parse(localStorage.getItem('mo_v1'))||{}}catch(e){D={}}
function save(){localStorage.setItem('mo_v1',JSON.stringify(D))}
function col(n){D[n]=D[n]||[];return D[n]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function money(n){n=Number(n)||0;return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})}
function today(){const d=new Date();return iso(d)}
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function pd(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fd(s){if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){const d=pd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5)}
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function dayName(s){return DAYS[pd(s).getDay()]}
/* form fields */
function F(id,label,o){o=o||{};const t=o.type||'text';let inp;
 if(t==='select')inp=`<select id="${id}">${o.opts.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return `<option value="${esc(v)}"${v==o.val?' selected':''}>${esc(l)}</option>`}).join('')}</select>`;
 else if(t==='textarea')inp=`<textarea id="${id}" placeholder="${esc(o.ph||'')}">${esc(o.val||'')}</textarea>`;
 else inp=`<input id="${id}" type="${t}" value="${esc(o.val==null?'':o.val)}" placeholder="${esc(o.ph||'')}"${t==='number'?' step="any" inputmode="decimal"':''}>`;
 return `<div><label for="${id}">${label}</label>${inp}</div>`}
const v=(id,r)=>{const e=$('#'+id,r);return e?e.value.trim():''};
const n=(id,r)=>parseFloat(v(id,r))||0;
function RES(pairs){return '<div class="res">'+pairs.map(p=>`<div><span class="k">${p[0]}</span><br><span class="v">${p[1]}</span></div>`).join('')+'</div>'}
function on(root,sel,ev,fn){$$(sel,root).forEach(e=>e.addEventListener(ev,fn))}
/* downloads */
function dl(name,data,mime){const b=new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(name,rows){const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';dl(name+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function wordDoc(name,html){dl(name+'.doc','<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;direction:rtl;font-size:14pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #444;padding:4px}</style></head><body dir="rtl">'+html+'</body></html>','application/msword')}
function printHtml(html){$('#printArea').innerHTML=html;window.print()}
/* document preview with Word / print buttons */
function docOut(el,name,html){el.innerHTML=`<div class="doc" id="dc">${html}</div><button class="b" data-a="w">تحميل Word</button><button class="b o" data-a="p">طباعة / PDF</button><button class="b o" data-a="c">نسخ النص</button>`;
 on(el,'[data-a=w]','click',()=>wordDoc(name,html));on(el,'[data-a=p]','click',()=>printHtml(html));
 on(el,'[data-a=c]','click',()=>{const t=$('#dc',el).innerText;navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'))})}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:99';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',1800)}
function phoneIntl(p){p=String(p||'').replace(/\D/g,'');if(!p)return '';if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='20'+p.slice(1);return p}
function waLink(text,phone){return 'https://wa.me/'+phoneIntl(phone)+'?text='+encodeURIComponent(text)}
function ics(name,events){const z=s=>s.replace(/-/g,'');const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//office//AR'];events.forEach(e=>{L.push('BEGIN:VEVENT','UID:'+uid()+'@office','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','SUMMARY:'+String(e.title).replace(/[\n,;]/g,' '));
 if(e.time){const t=e.time.replace(':','')+'00';L.push('DTSTART:'+z(e.date)+'T'+t)}else L.push('DTSTART;VALUE=DATE:'+z(e.date));
 L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:تذكير','TRIGGER:-PT'+(e.alarmMin||720)+'M','END:VALARM','END:VEVENT')});L.push('END:VCALENDAR');dl(name+'.ics',L.join('\r\n'),'text/calendar')}
/* editable rule tables with rule date, source, verification flag */
function ruleTable(root,key,title,cols,defaults,hint){
 D.tables=D.tables||{};if(!D.tables[key])D.tables[key]={rows:JSON.parse(JSON.stringify(defaults)),ruleDate:'',source:'',verified:false};
 const T=D.tables[key];
 function draw(){root.innerHTML=`<div class="box"><h3>${title}</h3>
 ${T.verified?'<div class="note ok">✔ تم التحقق منها</div>':'<div class="warn">⚠ أرقام مؤقتة (placeholder). لا تعتمد عليها قبل أن تدخل الأرقام الفعلية وتراجعها. اكتب تاريخ سريان القاعدة والمصدر ثم علّم «تم التحقق».</div>'}
 ${hint?`<div class="note">${hint}</div>`:''}
 <div class="row">${F('rt_d_'+key,'تاريخ سريان القاعدة',{type:'date',val:T.ruleDate})}${F('rt_s_'+key,'المصدر (قانون/قرار/موقع)',{val:T.source})}
 <div><label>تم التحقق منها؟</label><select id="rt_v_${key}"><option value="0"${!T.verified?' selected':''}>لا</option><option value="1"${T.verified?' selected':''}>نعم</option></select></div></div>
 <div class="tw"><table><tr>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th></th></tr>${T.rows.map((r,i)=>`<tr>${cols.map(c=>`<td><input data-i="${i}" data-k="${c.k}" type="${c.t||'text'}" step="any" value="${esc(r[c.k]==null?'':r[c.k])}"></td>`).join('')}<td><button class="b r s" data-del="${i}">حذف</button></td></tr>`).join('')}</table></div>
 <button class="b o" data-add="1">+ صف</button></div>`;
 on(root,'input[data-k]','change',e=>{const i=+e.target.dataset.i,k=e.target.dataset.k,c=cols.find(c=>c.k===k);T.rows[i][k]=c.t==='number'?(parseFloat(e.target.value)||0):e.target.value;save()});
 on(root,'[data-del]','click',e=>{T.rows.splice(+e.target.dataset.del,1);save();draw();T.onchange&&0});
 on(root,'[data-add]','click',()=>{const r={};cols.forEach(c=>r[c.k]=c.t==='number'?0:'');T.rows.push(r);save();draw()});
 $('#rt_d_'+key,root).onchange=e=>{T.ruleDate=e.target.value;save()};
 $('#rt_s_'+key,root).onchange=e=>{T.source=e.target.value;save()};
 $('#rt_v_'+key,root).onchange=e=>{T.verified=e.target.value==='1';save();draw()}}
 draw();return T}
function ruleBanner(T){return T.verified?`<div class="note ok">القاعدة: ${esc(T.source)} — سارية من ${fd(T.ruleDate)} ✔ تم التحقق</div>`:'<div class="warn">⚠ الجدول المستخدم لم يُتحقق منه بعد (أرقام مؤقتة). النتيجة تقديرية.</div>'}
function getTable(key,defaults){D.tables=D.tables||{};if(!D.tables[key])D.tables[key]={rows:JSON.parse(JSON.stringify(defaults)),ruleDate:'',source:'',verified:false};return D.tables[key]}
/* generic record list (add/delete) */
function listTable(root,rows,cols,delFn,extra){root.innerHTML=rows.length?`<div class="tw"><table><tr>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}<td>${extra?extra(r):''}<button class="b r s" data-del="${r.id}">حذف</button></td></tr>`).join('')}</table></div>`:'<div class="note">لا توجد سجلات.</div>';
 on(root,'[data-del]','click',e=>{if(confirm('حذف السجل؟')){delFn(e.target.dataset.del)}})}
const TOOLS=[];
function tool(id,r,t,d,f,ai){TOOLS.push({id,r,t,d,f,ai})}

/* Robot A: legal accountant */
tool('a1','a','حاسبة الأتعاب','مبلغ مقطوع أو نسبة أو بالجلسة، مع خصم وأقساط والمتبقي.',el=>{
 el.innerHTML=`<div class="box">${F('t','نوع الأتعاب',{type:'select',opts:[['fix','مبلغ مقطوع'],['pct','نسبة من قيمة القضية'],['ses','بالجلسة']]})}
 <div class="row" id="fx">${F('amt','المبلغ',{type:'number'})}${F('cv','قيمة القضية',{type:'number'})}${F('pc','النسبة %',{type:'number'})}${F('sn','عدد الجلسات',{type:'number'})}${F('sr','أتعاب الجلسة',{type:'number'})}
 ${F('ds','خصم %',{type:'number',val:0})}${F('pd','المدفوع',{type:'number',val:0})}${F('in','عدد الأقساط للمتبقي',{type:'number',val:1})}</div><button class="b" id="go">احسب</button><div id="o"></div></div>`;
 const vis=()=>{const t=v('t');$('#amt',el).parentNode.style.display=t==='fix'?'':'none';['cv','pc'].forEach(i=>$('#'+i,el).parentNode.style.display=t==='pct'?'':'none');['sn','sr'].forEach(i=>$('#'+i,el).parentNode.style.display=t==='ses'?'':'none')};$('#t',el).onchange=vis;vis();
 $('#go',el).onclick=()=>{const t=v('t');let g=t==='fix'?n('amt'):t==='pct'?n('cv')*n('pc')/100:n('sn')*n('sr');const d=g*n('ds')/100,tot=g-d,rem=tot-n('pd'),k=Math.max(1,n('in'));
 $('#o',el).innerHTML=RES([['الإجمالي قبل الخصم',money(g)],['الخصم',money(d)],['الصافي',money(tot)],['المدفوع',money(n('pd'))],['المتبقي',money(rem)],['قسط كل شهر ('+k+')',money(rem/k)]])}});
tool('a2','a','عقد أتعاب وجدول سداد','يولّد عقد اتفاق أتعاب مع جدول الأقساط (Word/PDF).',el=>{
 el.innerHTML=`<div class="box"><div class="row">${F('cn','اسم الموكل',{ph:'[اسم الموكل]'})}${F('ci','الرقم القومي (اختياري)',{})}${F('cs','موضوع القضية/المهمة',{ph:'[موضوع]'})}${F('tt','إجمالي الأتعاب',{type:'number'})}${F('dp','مقدم الأتعاب',{type:'number',val:0})}${F('kn','عدد الأقساط',{type:'number',val:3})}${F('fd','تاريخ أول قسط',{type:'date',val:today()})}${F('iv','كل كم شهر',{type:'number',val:1})}</div><div class="warn">النص مسودة عامة. راجعه وعدّله قبل التوقيع.</div><button class="b" id="go">إنشاء</button><div id="o"></div></div>`;
 $('#go',el).onclick=()=>{const k=Math.max(1,n('kn')),rem=n('tt')-n('dp'),q=rem/k;let rows='';for(let i=0;i<k;i++)rows+=`<tr><td>${i+1}</td><td>${fd(addMonths(v('fd'),i*Math.max(1,n('iv'))))}</td><td>${money(q)}</td></tr>`;
 const name=v('cn')||'[اسم الموكل]';
 docOut($('#o',el),'عقد-اتعاب',`<h2>اتفاق أتعاب محاماة</h2><p>إنه في يوم ${fd(today())} تحرر هذا الاتفاق بين:</p><p><b>أولاً:</b> الأستاذ/ ${esc(D.settings&&D.settings.lawyer||'ممدوح حازم')} المحامي (الطرف الأول).</p><p><b>ثانياً:</b> السيد/ ${esc(name)}${v('ci')?' رقم قومي '+esc(v('ci')):''} (الطرف الثاني).</p><p><b>البند الأول:</b> يوكل الطرف الثاني الطرف الأول في ${esc(v('cs')||'[موضوع القضية]')}.</p><p><b>البند الثاني:</b> اتفق الطرفان على أتعاب إجمالية قدرها ${money(n('tt'))} جنيه مصري، سُدد منها عند التوقيع ${money(n('dp'))} جنيهاً، والباقي ${money(rem)} جنيهاً يُسدد وفق الجدول التالي:</p><table><tr><th>القسط</th><th>تاريخ الاستحقاق</th><th>المبلغ</th></tr>${rows}</table><p><b>البند الثالث:</b> الأتعاب لا تشمل الرسوم والمصروفات القضائية، ويتحملها الطرف الثاني.</p><p><b>البند الرابع:</b> [شروط الإنهاء والإخطار — يكتبها المحامي].</p><p><b>البند الخامس:</b> حرر من نسختين بيد كل طرف نسخة.</p><p>الطرف الأول: ........ &nbsp;&nbsp;&nbsp;&nbsp; الطرف الثاني: ........</p>`)}});
function invoiceTool(el,corp){
 const cs=D.settings||{};
 el.innerHTML=`<div class="box"><div class="row">${F('ty','النوع',{type:'select',opts:[['فاتورة','فاتورة'],['إيصال استلام','إيصال استلام']]})}${F('cn',corp?'اسم الشركة العميلة':'اسم العميل')}${corp?F('tx','الرقم الضريبي للعميل'):''}${corp?F('ad','العنوان'):''}${F('dt','التاريخ',{type:'date',val:today()})}${F('vt','ضريبة % (إن وجدت)',{type:'number',val:0})}${F('pdv','المدفوع',{type:'number',val:0})}</div>
 ${F('it','البنود (كل سطر: الوصف | المبلغ)',{type:'textarea',ph:'أتعاب قضية رقم ... | 5000'})}<div class="warn">هذه مستند داخلي وليس فاتورة إلكترونية معتمدة من مصلحة الضرائب.</div><button class="b" id="go">إنشاء وحفظ</button><div id="o"></div></div><div class="box"><h3>السجل</h3><div id="ls"></div></div>`;
 const draw=()=>listTable($('#ls',el),col('invoices').filter(x=>!!x.corp===!!corp).slice().reverse(),[{l:'رقم',k:'no'},{l:'عميل',k:'cl'},{l:'نوع',k:'ty'},{l:'تاريخ',f:r=>fd(r.dt)},{l:'إجمالي',f:r=>money(r.tot)},{l:'متبقي',f:r=>money(r.tot-r.paid)}],id=>{D.invoices=D.invoices.filter(x=>x.id!==id);save();draw()},r=>`<button class="b o s" data-pay="${r.id}">تسديد</button> `);
 draw();on($('#ls',el),'[data-pay]','click',e=>{const r=D.invoices.find(x=>x.id===e.target.dataset.pay);const a=parseFloat(prompt('مبلغ مدفوع جديد',r.tot-r.paid));if(a){r.paid+=a;save();draw()}});
 $('#go',el).onclick=()=>{const items=v('it').split('\n').map(l=>l.split('|')).filter(a=>a[0].trim()).map(a=>({d:a[0].trim(),m:parseFloat(a[1])||0}));const sub=items.reduce((s,x)=>s+x.m,0),tx=sub*n('vt')/100,tot=sub+tx;

function bookTool(el,key,label){

 $('#sm',el).innerHTML=RES([['إيراد',money(i)],['مصروف',money(o)],['الصافي',money(i-o)]]);
 listTable($('#ls',el),r.slice().sort((a,b)=>b.dt.localeCompare(a.dt)),[{l:label,k:'cl'},{l:'تاريخ',f:x=>fd(x.dt)},{l:'نوع',f:x=>x.ty==='in'?'إيراد':'مصروف'},{l:'مبلغ',f:x=>money(x.am)},{l:'بيان',k:'ds'}],id=>{D[key]=D[key].filter(x=>x.id!==id);save();draw()})};draw();

 $('#g2',el).onclick=()=>{const k=Math.max(1,n('pk')),rem=n('pt')-n('pd'),q=rem/k;let r='';for(let i=0;i<k;i++)r+=`<tr><td>${i+1}</td><td>${fd(addMonths(v('ps'),i))}</td><td>${money(q)}</td></tr>`;docOut($('#o2',el),'اقساط-لاعب',`<h2>جدول أقساط - ${esc(v('pn'))}</h2><p>الإجمالي ${money(n('pt'))} / المقدم ${money(n('pd'))}</p><table><tr><th>القسط</th><th>الموعد</th><th>المبلغ</th></tr>${r}</table>`)};

const ROBOTS={
a:{n:'🧮 المحاسب القانوني',intro:{can:'حاسبة أتعاب، عقد أتعاب وجدول أقساط، فواتير وإيصالات، مصروفات القضايا، دفتر دخل ومصروف، تقدير رسوم المحكمة، دليل ضرائب، حاسبة مواعيد وفوائد، متابعة المتأخرات.',lim:'أرقام الرسوم والضرائب مؤقتة حتى تدخلها وتراجعها. لا يقدم إقرارات ضريبية ولا يتصل بالبنوك. البيانات تُحفظ في متصفحك فقط (جهاز واحد) فاعمل نسخة احتياطية. لا تكتب بيانات موكلين حساسة. ليس بديلاً عن محاسب أو مراجعة قانونية.'}},
s:{n:'🗂️ سكرتير المكتب',intro:{can:'نموذج استقبال موكل، مواعيد ورسائل تأكيد، يومية الجلسات والمواعيد (مع تصدير للتقويم لتذكير الموبايل)، قوائم مستندات، مكتبة رسائل، صياغة خطابات وإنذارات، غلاف وفهرس ملف القضية، تجهيز يوم المحكمة، ملخص أسبوعي.',lim:'لا يرسل رسائل بنفسه (يجهز الرسالة وتفتح على واتساب وتضغط إرسال أنت). لا تذكير تلقائي والصفحة مقفولة؛ استخدم تصدير التقويم. لا يقرأ واتساب أو البريد. البيانات في متصفحك فقط. النصوص القانونية مسودات تحتاج مراجعتك.'}},
c:{n:'🏢 المحاسب القانوني للشركات',intro:{can:'تقدير تكلفة تأسيس شركة، توزيع رأس المال وجدول المساهمين، مستندات الشركات (محاضر، قرارات، عقود، توكيل)، تقويم التزامات العملاء، متابعة الأتعاب الشهرية، فواتير الشركات، دفاتر بسيطة لكل عميل، توزيع الأرباح، أدوات الأندية، قوائم تراخيص، قائمة فحص نافي للجهالة.',lim:'ليس نظام محاسبة معتمداً ولا يراجع دفاتر حقيقية ولا يقدم إقرارات أو فواتير إلكترونية ولا يتصل بالهيئة العامة للاستثمار. جداول الرسوم والضرائب مؤقتة حتى تراجعها. بيانات العملاء المالية الحقيقية حساسة: قلل ما تكتبه، وانسخ احتياطياً، والنظام الخاص المدفوع أنسب لاحقاً.'}}};
const app=()=>$('#app');
let cur='a';
function route(){const h=location.hash.replace('#','');const t=TOOLS.find(x=>x.id===h);if(t){cur=t.r;return showTool(t)}if(ROBOTS[h]){cur=h}home()}
function home(){const R=ROBOTS[cur];
 app().innerHTML=`<div class="tabs">${Object.keys(ROBOTS).map(k=>`<button data-r="${k}" class="${k===cur?'on':''}">${ROBOTS[k].n}</button>`).join('')}</div>
 <div class="box pin"><details open><summary><b>📌 ${R.n}: ما يقدر عليه وحدوده</b></summary><p><b>يقدر على:</b> ${R.intro.can}</p><p><b>حدوده:</b> ${R.intro.lim}</p></details></div>
 <div class="grid">${TOOLS.filter(t=>t.r===cur).map(t=>`<div class="tc${t.ai?' ai':''}" data-t="${t.id}"><b>${t.t}</b><small>${t.d}</small></div>`).join('')}</div>`;
 on(app(),'[data-r]','click',e=>{cur=e.target.closest('[data-r]').dataset.r;location.hash=cur;home()});
 on(app(),'[data-t]','click',e=>{location.hash=e.target.closest('[data-t]').dataset.t})}
function showTool(t){app().innerHTML=`<button class="b o back" id="bk">← ${ROBOTS[t.r].n}</button><div class="box"><h3>${t.t}</h3><div class="note">${t.d}</div></div><div id="tv"></div>`;
 $('#bk').onclick=()=>{location.hash=t.r};
 try{t.f($('#tv'))}catch(e){$('#tv').innerHTML='<div class="warn">خطأ: '+esc(e.message)+'</div>'}}
window.addEventListener('hashchange',route);
/* lock + backup */
async function sha(s){if(!crypto.subtle)return btoa(unescape(encodeURIComponent(s)));const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mo|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function lockScreen(){
 if(sessionStorage.getItem('mo_ok')==='1'){return true}
 const L=$('#lock');L.style.display='flex';const first=!D.pin;
 L.innerHTML=`<div class="box"><h3>${first?'اختر رمز دخول (4 أحرف أو أكثر)':'أدخل رمز الدخول'}</h3>${F('pn','الرمز',{type:'password'})}${first?F('pn2','أعد كتابة الرمز',{type:'password'}):''}<div class="note">القفل بسيط لإبعاد الفضوليين من نفس الجهاز، وليس تشفيراً. لا تكتب فيه أسراراً.</div><button class="b g" id="go">دخول</button><div id="le" class="over"></div></div>`;
 return new Promise(res=>{$('#go').onclick=async()=>{const p=v('pn');if(first){if(p.length<4)return $('#le').textContent='الرمز قصير';if(p!==v('pn2'))return $('#le').textContent='الرمزان غير متطابقين';D.pin=await sha(p);save()}else if(await sha(p)!==D.pin)return $('#le').textContent='رمز خاطئ';sessionStorage.setItem('mo_ok','1');L.style.display='none';res(true)}})}
$('#lk').onclick=()=>{sessionStorage.removeItem('mo_ok');location.reload()};
$('#bkp').onclick=()=>{app().innerHTML=`<div class="box"><h3>نسخة احتياطية</h3><div class="note">بياناتك محفوظة في هذا المتصفح فقط. صدّر ملفاً أسبوعياً واحفظه في Drive. الملف يحتوي بياناتك فلا تشاركه.</div><button class="b" id="ex">تصدير النسخة</button><label>استيراد نسخة (يستبدل البيانات الحالية)</label><input type="file" id="im" accept=".json"><button class="b r" id="wp">مسح كل البيانات</button><button class="b o" id="bh">رجوع</button></div>`;
 $('#ex').onclick=()=>{const c=JSON.parse(JSON.stringify(D));dl('office-backup-'+today()+'.json',JSON.stringify(c),'application/json');D.lastBackup=today();save()};
 $('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(confirm('استبدال البيانات الحالية؟')){D=o;save();toast('تم الاستيراد');location.hash='';route()}}catch(x){alert('ملف غير صالح')}})};
 $('#wp').onclick=()=>{if(confirm('مسح كل البيانات نهائياً؟')){D={pin:D.pin};save();location.hash='';route()}};$('#bh').onclick=()=>{route()}};
(async()=>{await lockScreen();route();if(D.lastBackup&&diffDays(D.lastBackup,today())>7)toast('مرّ أكثر من أسبوع على آخر نسخة احتياطية')})();

</script>
